<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 수정</title>
</head>
<body>
<h1>글 수정하기</h1>
<form th:action="@{|/article/${article.id}/update|}" method="post">
    <input type="hidden" name="id" th:value="${article.id}">

    <div>
        <label>제목</label>
        <input type="text" name="title" th:value="${article.title}">
    </div>
    <div>
        <label>내용</label>
        <textarea name="content" rows="10" cols="50" th:text="${article.content}"></textarea>
    </div>

    <button type="submit">수정 완료</button>
    <a th:href="@{|/article/${article.id}|}">취소</a>
</form>
</body>
</html>

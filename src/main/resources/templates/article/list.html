<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<h1 th:if="${myArticleList != null}">내 글 목록</h1>
<h1 th:if="${myArticleList == null}">         </h1>
<h1 th:if="${articleList != null}">전체 글 목록</h1>

<a th:href="@{/article/new}">새 글 작성</a>
<hr>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th> 글쓴이 </th>
        <th>제목</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="article : ${myArticleList != null ? myArticleList : articleList}">
        <td th:text="${article.id}">1</td>
        <td th:text="${article.writer.userNickname}"> 글쓴이 </td>
        <td>
            <a th:href="@{|/article/${article.id}|}"
               th:text="${article.title}">제목</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
